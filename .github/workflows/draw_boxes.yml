name: draw-boxes

# Draws the logged blob box (RED) and MegaDetector's box (GREEN) onto the
# archived JPEGs and uploads them as an artifact, so "is the box on the animal"
# can be answered by looking.
#
# READ-ONLY. Does not commit, does not push, does not touch watch.py,
# cameras.py, selftest.py or watch.yml. Its only output is an artifact.
#
# DEFAULT SET IS `unreviewed`: every archived frame that is in neither
# ground_truth.txt nor reviewed.txt, which is exactly everything archived since
# the last review pass. It empties itself when the new keys are appended to the
# label files. `animals`, `empties` and `reviewed` all read those frozen files
# and therefore cannot see a new frame at all.
#
# THE GREEN BOX COMES FROM species/ BY DEFAULT, the daily production output of
# tools/identify.py. No file needs committing by hand. The older
# tools/identify_test.csv can still be added to the list, comma-separated.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which set: unreviewed | animals | empties | reviewed | all'
        required: false
        default: 'unreviewed'
      since:
        description: 'Earliest day YYYYMMDD, inclusive, or blank'
        required: false
        default: ''
      until:
        description: 'Latest day YYYYMMDD, inclusive, or blank'
        required: false
        default: ''
      dates:
        description: 'Exact comma-separated YYYYMMDD, or blank. Overrides nothing, applied on top of since/until'
        required: false
        default: ''
      cameras:
        description: 'Comma-separated camera dirs'
        required: false
        default: 'nossob,talamati,satara'
      roots:
        description: 'Which archive dirs: hits, frames, or both'
        required: false
        default: 'hits'
      md_min:
        description: 'Triage floor on MD confidence, 0 = off. A set drawn with this is biased toward stage 2 and must not price a stage 1 gate'
        required: false
        default: '0'
      limit:
        description: 'Max frames this run (0 = all)'
        required: false
        default: '0'
      offset:
        description: 'Skip this many first'
        required: false
        default: '0'
      identify_csv:
        description: 'Comma-separated paths or globs for the green box'
        required: false
        default: 'species/*/*.csv'

concurrency:
  group: draw-boxes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet pillow

      - name: Draw the boxes
        run: |
          python tools/draw_boxes.py \
            --only "${{ inputs.only }}" \
            --since "${{ inputs.since }}" \
            --until "${{ inputs.until }}" \
            --dates "${{ inputs.dates }}" \
            --cameras "${{ inputs.cameras }}" \
            --roots "${{ inputs.roots }}" \
            --md-min "${{ inputs.md_min }}" \
            --limit "${{ inputs.limit }}" \
            --offset "${{ inputs.offset }}" \
            --identify-csv "${{ inputs.identify_csv }}" \
            --labels tools/ground_truth.txt \
            --reviewed tools/reviewed.txt \
            --logs logs \
            --out annotated

      - name: Upload annotated frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotated-${{ inputs.only }}-${{ inputs.offset }}
          path: annotated
          retention-days: 30
          if-no-files-found: warn
