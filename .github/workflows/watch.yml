name: sanparks-watch

on:
  schedule:
    # Round the clock. Widened twice on 31 Aug 2026: first to 03:00-18:59 UTC
    # (05:00-20:59 local) to cover the middle of the day, then to everything.
    #
    # Two reasons. Daylight detection has never been confirmed on a mammal,
    # only on synthetic targets and on one dove flock, and a daylight animal is
    # far easier to identify by eye than a grey shape in IR. And Nossob's
    # nightly generator gap has never been characterised: running through it is
    # the only way to find out when it falls and whether the camera goes dark
    # or merely stops updating.
    #
    # cameras.py gates each camera again and its `active` is now [(0, 24)];
    # widening only one of the two does nothing.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Seconds to poll (use 40 for a quick connectivity test)"
        default: "270"
      collect:
        description: "Frames to archive: top | all | hits"
        default: "top"
      top_n:
        description: "Frames kept per run in 'top' mode"
        default: "1"
      force_all_hours:
        description: "Ignore the active-hours gate (1 = yes)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: sanparks-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      # Preset backgrounds are ~330 KB each and change every run. Committing
      # them would add hundreds of MB a day to the repo, so they live in the
      # Actions cache instead. A cache miss just costs one warm-up window.
      - name: Restore preset backgrounds
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: Watch the waterholes
        env:
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          RUNTIME:         ${{ inputs.runtime || '270' }}
          COLLECT:         ${{ inputs.collect || 'top' }}
          TOP_N:           ${{ inputs.top_n || '1' }}
          FORCE_ALL_HOURS: ${{ inputs.force_all_hours || '' }}
        run: python watch.py

      - name: Save preset backgrounds
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}

      - name: Commit logs, frames and hits
        if: always()
        run: |
          git config user.name  "sanparks-watch"
          git config user.email "actions@github.com"
          git add -A logs frames hits 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "watch $(date -u +'%F %T')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
