name: sanparks-watch

on:
  schedule:
    # Round the clock. Widened twice on 31 Aug 2026: first to 03:00-18:59 UTC
    # (05:00-20:59 local) to cover the middle of the day, then to everything.
    #
    # Two reasons. Daylight detection has never been confirmed on a mammal,
    # only on synthetic targets and on one dove flock, and a daylight animal is
    # far easier to identify by eye than a grey shape in IR. And Nossob's
    # nightly generator gap has never been characterised: running through it is
    # the only way to find out when it falls and whether the camera goes dark
    # or merely stops updating.
    #
    # cameras.py gates each camera again and its `active` is now [(0, 24)];
    # widening only one of them does nothing.
    #
    # A THIRD CAMERA, SATARA, WAS ADDED 2 SEP 2026. It costs no wall clock:
    # the cameras are threads sharing one deadline, so RUNTIME is unchanged and
    # timeout-minutes 15 still has its 5 minutes of headroom. What it does cost
    # is about 50% more archived JPEG per day and one more chance per run of a
    # 403 turning the job red.
    #
    # RUNTIME 270 -> 540 on 1 Sep 2026. At 270 s inside an 882 s cycle the
    # detector was awake 31% of the time and two thirds of every image both
    # cameras published was never fetched. 540 takes that to about 61%. The
    # repo is public so Actions minutes are free. This is the largest single
    # lever in the project and it is worth more than any threshold: the 1 Sep
    # lion was on camera for 22 seconds across three presets.
    #
    # DO NOT try to fix coverage by shortening this. Five minutes is GitHub's
    # documented floor and it is not being honoured anyway: measured over the
    # union of both logs, 31 Aug 17:00 to 1 Sep 09:27 local, 67 run windows in
    # 16h27m, one every 14.7 minutes. Two thirds of the scheduled events are
    # dropped. RUNTIME is the lever, not the cron. See below.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Seconds to poll (use 40 for a quick connectivity test)"
        default: "540"
      collect:
        description: "Frames to archive: top | all | hits"
        default: "top"
      top_n:
        # Kept in step with the scheduled default below. Both go back to 1
        # when the 3 Sep 2026 collection day ends. Irrelevant when collect=all.
        description: "Frames kept per run in 'top' mode (1 normally, 4 on a collection day)"
        default: "4"
      force_all_hours:
        description: "Ignore the active-hours gate (1 = yes)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: sanparks-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # RUNTIME 540 (9 min) plus ~40 s of checkout, pip, cache and push measured
    # on the 270 s runs puts a normal job at about 9m45. 15 leaves 5 minutes of
    # headroom for a slow pip install.
    #
    # Do not raise it further. `concurrency` has cancel-in-progress: false, so
    # a hung job holds the queue for the whole timeout and every run behind it
    # waits. At 15 a hang costs about one run; at 30 it would cost two or three.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      # Preset backgrounds are ~330 KB each and change every run. Committing
      # them would add hundreds of MB a day to the repo, so they live in the
      # Actions cache instead. A cache miss just costs one warm-up window.
      - name: Restore preset backgrounds
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: Watch the waterholes
        env:
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          RUNTIME:         ${{ inputs.runtime || '540' }}
          COLLECT:         ${{ inputs.collect || 'top' }}
          # 1 -> 4 ON 3 SEP 2026 FOR A DAYLIGHT COLLECTION DAY.
          # REVERT TO 1 BEFORE DARK. At 4 this is roughly 50 MB of JPEG per
          # full daylight day, from the 900px thumbnails the archive actually
          # stores and the observed cadence of about one run every 14.7 min.
          #
          # WHY, THIS TIME. The daylight blob is the project's biggest unknown:
          # eleven of the thirteen daylight frames ever reviewed have a box
          # that lands on nothing, and all thirteen came from TOP_N 1, which
          # keeps only the single largest blob of each run. That is the most
          # broken frame of every window, by construction. Four per run is
          # still biased toward big blobs but it is four times the sample and
          # it costs one line.
          #
          # THE UNBIASED SAMPLE IS A SEPARATE JOB and it is a manual dispatch,
          # not this line: one run with collect=all archives every frame of a
          # 9-minute window, about 60 a camera, and that is the only thing that
          # answers "does the blob land on the animal when the background is
          # good". Do NOT set collect=all here; a full day of it is ~190 MB.
          #
          # History of this line: back to 1 on the evening of 1 Sep 2026 after
          # a collection half-day at 4 produced 76 archived daylight frames per
          # camera between 09:52 and 15:51 UTC.
          TOP_N:           ${{ inputs.top_n || '4' }}
          FORCE_ALL_HOURS: ${{ inputs.force_all_hours || '' }}
        run: python watch.py

      - name: Save preset backgrounds
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}

      - name: Commit logs, frames and hits
        if: always()
        run: |
          git config user.name  "sanparks-watch"
          git config user.email "actions@github.com"
          git add -A logs frames hits 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "watch $(date -u +'%F %T')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
